name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: Build, test, format
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swift --version
          xcode-select -p
          swift format --version || brew install swift-format

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Format lint
        run: swift format lint -r Sources Tests
