name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: Build, test, format
    # arm64 macOS hosted runners can queue for a long time under capacity pressure.
    # The Intel image runs the same Swift code and keeps PR checks deterministic.
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swift --version
          xcode-select -p
          swift format --version || brew install swift-format

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Format lint
        run: swift format lint -r Sources Tests
