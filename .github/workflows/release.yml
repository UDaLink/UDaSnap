name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Universal app and assets
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Build app
        run: bash ./build.sh

      - name: Verify signature
        run: |
          codesign --verify --deep --strict dist/UDaSnap.app
          plutil -p dist/UDaSnap.app/Contents/Info.plist

      - name: Package
        run: |
          set -euo pipefail
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/UDaSnap.app/Contents/Info.plist)"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' dist/UDaSnap.app/Contents/Info.plist)"
          ZIP="UDaSnap-${VERSION}-macos-universal-unsigned.zip"
          ditto -c -k --sequesterRsrc --keepParent dist/UDaSnap.app "dist/${ZIP}"
          (cd dist && shasum -a 256 "${ZIP}" > SHA256SUMS.txt)
          echo "ZIP=${ZIP}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "BUILD=${BUILD}" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: UDaSnap-${{ env.VERSION }}-universal
          path: |
            dist/${{ env.ZIP }}
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" \
            "dist/${ZIP}" \
            "dist/SHA256SUMS.txt" \
            --title "UDaSnap ${VERSION}" \
            --notes "UDaSnap ${VERSION} (build ${BUILD}). Universal macOS build; unsigned and not notarized. See README for the source-build path and SHA256SUMS.txt for verification."
