name: Feature request
description: Suggest a focused improvement for UDaSnap.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Capture
        - Scrolling
        - OCR
        - AI / translation
        - Pin window
        - Hotkeys
        - Settings
        - Docs
        - Other
    validations:
      required: true
